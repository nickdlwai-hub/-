<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER // 暖心餐飲決策系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #140f0c;
      --bg-panel: rgba(32, 23, 18, 0.76);
      --bg-card: rgba(44, 32, 25, 0.68);
      --bg-card-hover: rgba(62, 45, 35, 0.88);
      --border-dim: rgba(244, 162, 97, 0.18);
      --border-bright: rgba(244, 162, 97, 0.65);
      --amber: #f4a261;
      --amber-light: #ffbe85;
      --amber-glow: rgba(244, 162, 97, 0.25);
      --coral: #e76f51;
      --coral-glow: rgba(231, 111, 81, 0.25);
      --text-primary: #fdf6ee;
      --text-secondary: #cbb9a8;
      --text-muted: #8a7564;
      --font-sans: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Orbitron', 'Noto Sans TC', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      line-height: 1.6;
    }

    /* Warm Cinematic Background Grid & Golden Hour Ambient Glow */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(244, 162, 97, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(244, 162, 97, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 40%, black 35%, transparent 90%);
      -webkit-mask-image: radial-gradient(circle at 50% 40%, black 35%, transparent 90%);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-orb {
      position: fixed;
      width: 720px;
      height: 720px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 162, 97, 0.14) 0%, rgba(231, 111, 81, 0.06) 45%, transparent 72%);
      top: -240px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
      filter: blur(28px);
    }

    .ambient-orb-bottom {
      position: fixed;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(231, 111, 81, 0.08) 0%, transparent 70%);
      bottom: -220px;
      right: -120px;
      pointer-events: none;
      z-index: 0;
      filter: blur(30px);
    }

    .scanline {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(15, 8, 4, 0.14) 51%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 99;
      opacity: 0.18;
    }

    /* Layout Container */
    .app-shell {
      position: relative;
      z-index: 2;
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 24px 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Top Telemetry Header */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-dim);
      margin-bottom: 32px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border-bright);
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(244, 162, 97, 0.1);
      position: relative;
      box-shadow: 0 0 20px rgba(244, 162, 97, 0.16);
      color: var(--amber);
    }

    .brand-text h1 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      letter-spacing: 0.14em;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .brand-text span {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--amber);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .telemetry {
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(244, 162, 97, 0.08);
      border: 1px solid var(--border-dim);
      border-radius: 20px;
      color: var(--amber);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--amber);
      box-shadow: 0 0 8px var(--amber);
      animation: pulse 2.2s infinite ease-in-out;
    }

    /* Progress Stepper */
    .stepper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 36px;
    }

    .step-item {
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      border-radius: 8px;
      padding: 14px 18px;
      position: relative;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .step-item.active {
      border-color: var(--border-bright);
      background: rgba(244, 162, 97, 0.09);
      box-shadow: 0 4px 24px rgba(244, 162, 97, 0.1);
    }

    .step-item.completed {
      border-color: rgba(244, 162, 97, 0.38);
    }

    .step-item::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2.5px;
      width: 0%;
      background: linear-gradient(90deg, var(--amber), var(--coral));
      transition: width 0.4s ease;
    }

    .step-item.active::after, .step-item.completed::after {
      width: 100%;
    }

    .step-code {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .step-item.active .step-code, .step-item.completed .step-code {
      color: var(--amber);
    }

    .step-label {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-item.active .step-label, .step-item.completed .step-label {
      color: var(--text-primary);
    }

    /* Main Stage */
    .stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .stage-title-group .kicker {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--amber);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .stage-title-group h2 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-primary);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      color: var(--text-secondary);
      padding: 8px 16px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      letter-spacing: 0.05em;
    }

    .btn-ghost:hover {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(244, 162, 97, 0.08);
    }

    /* Selection Grid */
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
      animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-card {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 168px;
      text-align: left;
      overflow: hidden;
    }

    .hud-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: radial-gradient(circle at top right, rgba(244, 162, 97, 0.12), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .hud-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-bright);
      transform: translateY(-4px);
      box-shadow: 0 14px 32px rgba(10, 5, 2, 0.45), 0 0 24px rgba(244, 162, 97, 0.12);
    }

    .hud-card:hover::after {
      opacity: 1;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid rgba(244, 162, 97, 0.28);
      background: rgba(244, 162, 97, 0.08);
      display: grid;
      place-items: center;
      color: var(--amber);
      transition: all 0.3s ease;
    }

    .hud-card:hover .card-icon {
      background: rgba(244, 162, 97, 0.18);
      border-color: var(--amber);
      box-shadow: 0 0 16px var(--amber-glow);
    }

    .card-code {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    .hud-card:hover .card-code {
      color: var(--amber);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .card-meta {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 235, 215, 0.08);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-card:hover .card-meta {
      color: var(--amber);
    }

    /* Scanning / Analyzing Overlay */
    .analyzing-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      animation: fadeIn 0.25s ease;
    }

    .radar-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 1px solid rgba(244, 162, 97, 0.28);
      position: relative;
      display: grid;
      place-items: center;
      margin-bottom: 28px;
      background: radial-gradient(circle, rgba(244, 162, 97, 0.08) 0%, transparent 70%);
    }

    .radar-ring::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--amber);
      border-right-color: var(--coral);
      animation: spin 1s linear infinite;
    }

    .radar-ring::after {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px dashed rgba(244, 162, 97, 0.55);
      animation: spinReverse 2.5s linear infinite;
    }

    .radar-core {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--amber);
      letter-spacing: 0.1em;
    }

    .analyzing-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: 0.16em;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .analyzing-log {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--amber);
      opacity: 0.9;
    }

    /* Step 3: Result View (Warm Cinematic Target Card) */
    .result-wrapper {
      animation: fadeSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .target-panel {
      background: linear-gradient(145deg, rgba(46, 33, 25, 0.9) 0%, rgba(24, 17, 13, 0.95) 100%);
      border: 1px solid var(--border-bright);
      border-radius: 14px;
      padding: 36px;
      position: relative;
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 60px rgba(8, 4, 2, 0.65), 0 0 45px rgba(244, 162, 97, 0.1);
    }

    .target-panel::before, .target-panel::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid var(--amber);
      border-radius: 4px;
    }
    .target-panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-bottom-left-radius: 0; border-top-right-radius: 0; }
    .target-panel::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-top-right-radius: 0; border-bottom-left-radius: 0; }

    .target-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(244, 162, 97, 0.18);
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .target-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--amber-light);
      border: 1px solid rgba(231, 111, 81, 0.45);
      background: rgba(231, 111, 81, 0.14);
      border-radius: 20px;
      padding: 4px 14px;
      letter-spacing: 0.12em;
      margin-bottom: 14px;
    }

    .target-name {
      font-size: 2.15rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.02em;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .target-sub {
      font-size: 1rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .rating-box {
      background: rgba(244, 162, 97, 0.08);
      border: 1px solid var(--border-dim);
      border-radius: 10px;
      padding: 14px 22px;
      text-align: right;
      min-width: 140px;
    }

    .rating-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .rating-score {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--amber);
      line-height: 1.1;
      margin-top: 4px;
    }

    .target-specs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .spec-box {
      background: rgba(255, 240, 225, 0.03);
      border: 1px solid rgba(244, 162, 97, 0.14);
      border-radius: 8px;
      padding: 16px 18px;
    }

    .spec-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--amber);
      letter-spacing: 0.1em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .spec-value {
      font-size: 0.98rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    .target-brief {
      background: rgba(244, 162, 97, 0.06);
      border-left: 3px solid var(--amber);
      border-radius: 0 8px 8px 0;
      padding: 16px 20px;
      margin-bottom: 32px;
      color: var(--text-secondary);
      font-size: 0.96rem;
      line-height: 1.75;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .action-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--amber) 0%, var(--coral) 100%);
      color: #1c1008;
      border: none;
      border-radius: 8px;
      padding: 13px 26px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.04em;
      transition: all 0.25s ease;
      text-decoration: none;
      box-shadow: 0 6px 24px var(--amber-glow);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(244, 162, 97, 0.45);
    }

    .btn-secondary {
      background: rgba(244, 162, 97, 0.1);
      color: var(--amber-light);
      border: 1px solid var(--border-bright);
      border-radius: 8px;
      padding: 13px 22px;
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s ease;
    }

    .btn-secondary:hover {
      background: rgba(244, 162, 97, 0.18);
      transform: translateY(-2px);
    }

    /* Footer */
    .hud-footer {
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid rgba(244, 162, 97, 0.1);
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Animations */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.82); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes spinReverse {
      to { transform: rotate(-360deg); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Responsive Adjustments */
    @media (max-width: 720px) {
      .stepper {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .target-panel {
        padding: 24px 20px;
      }
      .target-name {
        font-size: 1.65rem;
      }
      .rating-box {
        text-align: left;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .telemetry {
        width: 100%;
        justify-content: space-between;
      }
      .action-group {
        width: 100%;
      }
      .btn-primary, .btn-secondary {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="ambient-orb"></div>
  <div class="ambient-orb-bottom"></div>
  <div class="scanline"></div>

  <div class="app-shell">
    <!-- Top HUD Bar -->
    <header class="hud-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9" stroke-dasharray="4 3"/>
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>AETHER // GASTRO-NAV</h1>
          <span>WARM CULINARY DECISION OS v4.2</span>
        </div>
      </div>

      <div class="telemetry">
        <span id="clock-display">SYS.TIME --:--:--</span>
        <div class="status-badge">
          <span class="pulse-dot"></span>
          <span>WARM LINK ACTIVE</span>
        </div>
      </div>
    </header>

    <!-- 3-Step Indicator -->
    <nav class="stepper" aria-label="決策進度">
      <div class="step-item active" id="step-ind-1">
        <div class="step-code"><span>PHASE 01</span><span id="ind-val-1">AWAITING</span></div>
        <div class="step-label">選定餐飲種類</div>
      </div>
      <div class="step-item" id="step-ind-2">
        <div class="step-code"><span>PHASE 02</span><span id="ind-val-2">STANDBY</span></div>
        <div class="step-label">鎖定所屬地區</div>
      </div>
      <div class="step-item" id="step-ind-3">
        <div class="step-code"><span>PHASE 03</span><span id="ind-val-3">LOCKED</span></div>
        <div class="step-label">推薦目標餐廳</div>
      </div>
    </nav>

    <!-- Dynamic Main Stage -->
    <main class="stage-container" id="stage"></main>

    <!-- Footer Telemetry -->
    <footer class="hud-footer">
      <span>// DATABASE: 60 VERIFIED CULINARY NODES</span>
      <span>PROTOCOL: COZY PRECISION DINING</span>
    </footer>
  </div>

  <script>
    // ==========================================
    // 1. SYSTEM DATA MATRIX (Categories, Regions, Restaurants)
    // ==========================================
    const CATEGORIES = [
      {
        id: 'japanese',

      { cat: 'japanese', reg: 'kaohsiung', name: '碳佐麻里 精品燒肉 高美店', district: '鼓山區・美術東四路', rating: '4.7', price: '$$$', signature: '極上和牛拼盤、石鍋蒜蝦飯', brief: '南台灣燒肉霸主，清水模水上建築氣勢磅礴，結合日式燒肉與多樣化精緻單點，體驗感極佳。' },

      { cat: 'hotpot', reg: 'kaohsiung', name: '冬鄉小廚 酸菜白肉鍋', district: '鼓山區・西藏街', rating: '4.6', price: '$$', signature: '東北天然發酵酸菜白肉鍋、手工川丸子', brief: '傳承三代的眷村好味道，自然發酵的溫潤酸香搭配手切白肉，越煮越甘甜。' },
      { cat: 'hotpot', reg: 'kaohsiung', name: '茶六燒肉堂 博愛店', district: '左營區・博愛二路', rating: '4.8', price: '$$$', signature: '極上牛排套餐、泡菜、雪花冰', brief: '北高雄最具指標性的排隊燒肉殿堂，寬敞挑高的暗色系裝潢與穩定肉質，絕不踩雷。' },
      { cat: 'hotpot', reg: 'kaohsiung', name: '老四川巴蜀麻辣燙 南屏店', district: '鼓山區・南屏路', rating: '4.6', price: '$$', signature: '絕選麻辣鍋、川味涼粉、油條', brief: '發跡於高雄的麻辣鍋名店，藥膳與辣油香氣厚實，搭配酸辣開胃的川味涼粉是經典組合。' },

      { cat: 'western', reg: 'kaohsiung', name: 'THOMAS CHIEN 法式餐廳', district: '前鎮/鼓山接壤・高雄軟體園區旁', rating: '4.8', price: '$$$$', signature: '大地時蔬沙拉、法式乾式熟成鴨胸', brief: '南台灣法餐領航者，極簡現代空間與米其林綠星永續理念，每一道菜都是對南國風土的致敬。' },
      { cat: 'western', reg: 'kaohsiung', name: '薄多義 Bite 2 Eat 裕誠店', district: '左營區・裕誠路', rating: '4.5', price: '$$', signature: '窯烤手工披薩、法式芥末子雞肉麵', brief: '起源於高雄的歐風小鎮義式餐館，窯烤披薩餅皮焦香有嚼勁，氛圍輕鬆自在。' },
      { cat: 'western', reg: 'kaohsiung', name: 'Marc L³', district: '前金/鼓山交界', rating: '4.9', price: '$$$$', signature: '當代預約制無菜單料理', brief: '南台灣最難訂位的當代料理之一，主廚以開放式廚房與強烈個人風格展現前衛餐飲美學。' },

      { cat: 'asian', reg: 'kaohsiung', name: '鼎泰豐 高雄漢神巨蛋店', district: '左營區・漢神巨蛋B1', rating: '4.8', price: '$$', signature: '絲瓜蝦仁小籠包、酸辣湯、炒飯', brief: '北高雄聚餐最穩定的選擇，高效率動線與零誤差口感，滿足想吃精緻麵點的渴望。' },
      { cat: 'asian', reg: 'kaohsiung', name: '帕泰家 Baan Phadthai', district: '左營區・巨蛋商圈', rating: '4.6', price: '$$', signature: '甘醬牛肉河粉、泰式酥炸軟殼蟹', brief: '連續獲得曼谷米其林必比登推薦的泰式河粉名店，南洋香料與椰糖風味極具辨識度。' },
      { cat: 'asian', reg: 'kaohsiung', name: '海光俱樂部 中餐廳', district: '左營區・南大路', rating: '4.6', price: '$$', signature: '蔥油餅、酸菜白肉鍋、砂鍋魚頭', brief: '隱身左營海軍基地旁的歷史建築餐廳，道地江浙菜與北方麵點手藝，充滿時代電影感。' },

      { cat: 'cafe', reg: 'kaohsiung', name: '路人咖啡 3號店 / 鼓山館', district: '鼓山/三民區', rating: '4.7', price: '$', signature: '自家烘焙單品手沖、肉桂捲', brief: '台灣咖啡界傳奇獨立品牌，高水準烘焙技術與親民價格，是南台灣咖啡迷的必訪聖地。' },
      { cat: 'cafe', reg: 'kaohsiung', name: '卡啡那 Caffaina 美術館店', district: '鼓山區・美術東二路', rating: '4.6', price: '$$', signature: '法式舒芙蕾、虹吸咖啡', brief: '挑高歐式圖書館風格的旗艦咖啡廳，大片玻璃引入美術館綠意，甜點與空間感極佳。' },
      { cat: 'cafe', reg: 'kaohsiung', name: '永心鳳茶 奶茶專門所', district: '鼓山/駁二沿線', rating: '4.7', price: '$$', signature: '台灣精品冷泡茶、千層蛋糕、鍋燒意麵', brief: '融合復古摩登台式美學的茶飲沙龍，在質感空間中品味最道地的台灣烏龍茶與精緻鹹甜食。' }
    ];

    // ==========================================
    // 2. APPLICATION STATE & DOM REFERENCES
    // ==========================================
    const state = {
      step: 1,
      selectedCategory: null,
      selectedRegion: null,
      matches: [],
      currentIndex: 0
    };

    const stageEl = document.getElementById('stage');

    // ==========================================
    // 3. LIVE TELEMETRY CLOCK
    // ==========================================
    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('clock-display').textContent =
        `SYS.TIME ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ==========================================
    // 4. STEPPER UI SYNC
    // ==========================================
    function updateStepper() {
      const ind1 = document.getElementById('step-ind-1');
      const ind2 = document.getElementById('step-ind-2');
      const ind3 = document.getElementById('step-ind-3');

      [ind1, ind2, ind3].forEach(el => el.classList.remove('active', 'completed'));

      if (state.step === 1) {
        ind1.classList.add('active');
        document.getElementById('ind-val-1').textContent = 'SELECTING';
        document.getElementById('ind-val-2').textContent = 'STANDBY';
        document.getElementById('ind-val-3').textContent = 'LOCKED';
      } else if (state.step === 2) {
        ind1.classList.add('completed');
        ind2.classList.add('active');
        document.getElementById('ind-val-1').textContent = state.selectedCategory.name;
        document.getElementById('ind-val-2').textContent = 'SELECTING';
        document.getElementById('ind-val-3').textContent = 'LOCKED';
      } else if (state.step === 3) {
        ind1.classList.add('completed');
        ind2.classList.add('completed');
        ind3.classList.add('active');
        document.getElementById('ind-val-1').textContent = state.selectedCategory.name;
        document.getElementById('ind-val-2').textContent = state.selectedRegion.name;
        document.getElementById('ind-val-3').textContent = 'TARGET LOCKED';
      }
    }

    // ==========================================
    // 5. RENDER FUNCTIONS
    // ==========================================
    function renderStep1() {
      state.step = 1;
      updateStepper();

      stageEl.innerHTML = `
        <div class="stage-header">
          <div class="stage-title-group">
            <span class="kicker">// PROTOCOL 01 : CULINARY CLASSIFICATION</span>
            <h2>今天想吃哪一種類型的料理？</h2>
          </div>
        </div>
        <div class="grid-cards">
          ${CATEGORIES.map(cat => `
            <button class="hud-card" onclick="selectCategory('${cat.id}')">
              <div>
                <div class="card-top">
                  <div class="card-icon">${cat.icon}</div>
                  <span class="card-code">${cat.code}</span>
                </div>
                <div class="card-title">${cat.name}</div>
                <div class="card-desc">${cat.desc}</div>
              </div>
              <div class="card-meta">
                <span>${cat.countText}</span>
                <span>INITIALIZE &rarr;</span>
              </div>
            </button>
          `).join('')}
        </div>
      `;
    }

    function renderStep2() {
      state.step = 2;
      updateStepper();

      stageEl.innerHTML = `
        <div class="stage-header">
          <div class="stage-title-group">
            <span class="kicker">// PROTOCOL 02 : GEOGRAPHIC SECTOR LOCK</span>
            <h2>請選擇您目前的所在地區</h2>
          </div>
          <button class="btn-ghost" onclick="renderStep1()">
            &larr; RETURN TO CATEGORY
          </button>
        </div>
        <div class="grid-cards">
          ${REGIONS.map(reg => `
            <button class="hud-card" onclick="selectRegion('${reg.id}')">
              <div>
                <div class="card-top">
                  <div class="card-icon">${reg.icon}</div>
                  <span class="card-code">${reg.code}</span>
                </div>
                <div class="card-title">${reg.name}</div>
                <div class="card-desc">${reg.desc}</div>
              </div>
              <div class="card-meta">
                <span>NODE VERIFIED</span>
                <span>SCAN SECTOR &rarr;</span>
              </div>
            </button>
          `).join('')}
        </div>
      `;
    }

    function runAnalysisAndShowResult() {
      state.step = 3;
      updateStepper();

      stageEl.innerHTML = `
        <div class="analyzing-view">
          <div class="radar-ring">
            <span class="radar-core" id="scan-pct">0%</span>
          </div>
          <div class="analyzing-title">CALCULATING OPTIMAL TARGET</div>
          <div class="analyzing-log" id="scan-log">
            QUERYING [${state.selectedCategory.name}] IN [${state.selectedRegion.name}]...
          </div>
        </div>
      `;

      const pctEl = document.getElementById('scan-pct');
      const logEl = document.getElementById('scan-log');
      const logs = [
        'CALIBRATING TASTE MATRIX...',
        'CROSS-REFERENCING RATING TELEMETRY...',
        'FILTERING TOP TIER NODES...',
        'TARGET ACQUIRED.'
      ];

      let progress = 0;
      const timer = setInterval(() => {
        progress += 10;
        if (pctEl) pctEl.textContent = `${Math.min(progress, 100)}%`;
        const logIdx = Math.min(Math.floor(progress / 28), logs.length - 1);
        if (logEl) logEl.textContent = logs[logIdx];

        if (progress >= 100) {
          clearInterval(timer);
          setTimeout(renderResultCard, 180);
        }
      }, 65);
    }

    function renderResultCard() {
      const target = state.matches[state.currentIndex];
      const mapQuery = encodeURIComponent(`${target.name} ${target.district}`);
      const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;

      stageEl.innerHTML = `
        <div class="stage-header">
          <div class="stage-title-group">
            <span class="kicker">// PROTOCOL 03 : TARGET ACQUISITION COMPLETE</span>
            <h2>系統為您推薦今日最佳餐廳</h2>
          </div>
          <button class="btn-ghost" onclick="renderStep2()">
            &larr; CHANGE SECTOR
          </button>
        </div>

        <div class="result-wrapper">
          <div class="target-panel">
            <div class="target-header">
              <div>
                <div class="target-tag">
                  <span class="pulse-dot" style="background: var(--coral); box-shadow: 0 0 8px var(--coral);"></span>
                  <span>OPTIMAL MATCH // PRIORITY #0${state.currentIndex + 1}</span>
                </div>
                <h3 class="target-name">${target.name}</h3>
                <div class="target-sub">
                  <span>${state.selectedRegion.name}</span>
                  <span>•</span>
                  <span>${target.district}</span>
                  <span>•</span>
                  <span>${state.selectedCategory.name}</span>
                </div>
              </div>

              <div class="rating-box">
                <div class="rating-label">TACTICAL SCORE</div>
                <div class="rating-score">${target.rating} <span style="font-size:0.9rem; color:var(--text-secondary);">/ 5.0</span></div>
              </div>
            </div>

            <div class="target-specs">
              <div class="spec-box">
                <div class="spec-label">// SIGNATURE DISHES (推薦必點)</div>
                <div class="spec-value">${target.signature}</div>
              </div>
              <div class="spec-box">
                <div class="spec-label">// SECTOR COORDINATE (所在區域)</div>
                <div class="spec-value">${target.district}</div>
              </div>
              <div class="spec-box">
                <div class="spec-label">// BUDGET TIER (消費等級)</div>
                <div class="spec-value">${target.price} (${getPriceDesc(target.price)})</div>
              </div>
            </div>

            <div class="target-brief">
              <strong style="color: var(--amber); font-family: var(--font-mono); font-size: 0.82rem; display:block; margin-bottom:6px;">
                // INTELLIGENCE BRIEFING:
              </strong>
              ${target.brief}
            </div>

            <div class="action-bar">
              <div class="action-group">
                <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="btn-primary">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <polygon points="3 11 22 2 13 21 11 13 3 11"/>
                  </svg>
                  開啟地圖導航
                </a>
                <button class="btn-secondary" onclick="rerollTarget()">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                  </svg>
                  換一家推薦 (${state.currentIndex + 1}/${state.matches.length})
                </button>
              </div>
              <button class="btn-ghost" onclick="resetSystem()">
                RESET SYSTEM // 重新開始
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 6. INTERACTION HANDLERS
    // ==========================================
    function getPriceDesc(price) {
      const map = {
        '$': '親民日常 NT$200-500',
        '$$': '中價質感 NT$500-1,000',
        '$$$': '精緻饗宴 NT$1,000-2,000',
        '$$$$': '頂級奢華 NT$2,000+'
      };
      return map[price] || '依現場點餐';
    }

    function selectCategory(categoryId) {
      state.selectedCategory = CATEGORIES.find(c => c.id === categoryId);
      renderStep2();
    }

    function selectRegion(regionId) {
      state.selectedRegion = REGIONS.find(r => r.id === regionId);

      const filtered = RESTAURANTS.filter(
        r => r.cat === state.selectedCategory.id && r.reg === state.selectedRegion.id
      );
      state.matches = shuffleArray([...filtered]);
      state.currentIndex = 0;

      runAnalysisAndShowResult();
    }

    function rerollTarget() {
      if (state.matches.length <= 1) return;
      state.currentIndex = (state.currentIndex + 1) % state.matches.length;
      renderResultCard();
    }

    function resetSystem() {
      state.selectedCategory = null;
      state.selectedRegion = null;
      state.matches = [];
      state.currentIndex = 0;
      renderStep1();
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Initialize Application
    renderStep1();
  </script>
